[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "arc-os"
version = "0.1.0"
description = "ArcOS: launcher de aplicativos Android com senha, rodando no Termux"
readme = "README.md"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
arc-os = "arcos.cli:main"
arcos = "arcos.cli:main"

[tool.setuptools]
packages = ["arcos"]
